# Conservative stationary-validation profile; distances are provisional.
# Source/receipt timestamps must be on the Jetson's ROS clock.
vfh_obstacle_avoidance:
  ros__parameters:
    use_fusion: false
    forward_speed: 0.08
    min_speed: 0.0
    max_yaw_rate: 0.4
    front_stop_dist: 0.5
    front_slowdown_dist: 1.0
    scan_timeout_sec: 0.25
    max_scan_age_sec: 0.5
    obstacle_hold_sec: 0.5
safety_mux_node:
  ros__parameters:
    lidar_only_mode: true
    prefer_camera_when_target_seen: false
    max_linear_speed: 0.08
    max_angular_speed: 0.4
    front_stop_dist: 0.5
    vfh_timeout_sec: 0.25
    scan_timeout_sec: 0.25
    max_scan_age_sec: 0.5
cmd_vel_to_serial:
  ros__parameters:
    # Unchanged v4 sonar telemetry freshness; navigation remains LiDAR-only.
    ultrasonic_timeout_sec: 0.8
    cmd_timeout_sec: 0.25
    max_linear_speed: 0.08
    max_angular_speed: 0.4
